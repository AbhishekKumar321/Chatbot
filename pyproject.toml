[tool.poetry]
name = "rag-chatbot"
version = "0.1.0"
description = "Open-source RAG platform"
authors = []
packages = [
    { include = "ingestion" },
    { include = "retrieval" },
    { include = "generation" },
]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.9"
pypdf = "^5.0"
syntok = "^1.4"
numpy = "^2.1"
fastapi = "^0.115"
python-multipart = "^0.0.12"
qdrant-client = "^1.12"
sentence-transformers = "^3.3"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
mypy = "^1.13"
ruff = "^0.7"
types-Markdown = "^3.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "syntok.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "xhtml2pdf.*"
ignore_missing_imports = true
